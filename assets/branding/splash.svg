    <polyline points="376,416 496,512 376,608" fill="none" stroke="#82aaff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="536" y="486" width="104" height="52" rx="10" fill="#c8d3f5"/>
  </g>
</svg>
